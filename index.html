<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aliya's Experience Check-in 💗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff4f8;
    --ink: #4a2238;
    --soft: #8a5a73;
    --pink: #ff5c9d;
    --rose: #ff8fb8;
    --blush: #ffd6e6;
    --card: #ffffff;
    --grad: linear-gradient(90deg, #ff5c9d, #ff9ec4, #c86bff, #ff5c9d);
    font-family: 'Kalam', 'Segoe Print', 'Bradley Hand', cursive;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background:
      radial-gradient(circle at 10% 0%, var(--blush) 0, transparent 40%),
      radial-gradient(circle at 100% 30%, #ffe3ef 0, transparent 35%),
      var(--bg);
    color: var(--ink);
    font-size: 1.1rem;
    line-height: 1.6;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 34rem; margin: 0 auto; padding: 0 1.25rem 2rem; }

  /* Hero */
  .hero { text-align: center; padding: 3.5rem 0 2rem; }
  .hero h1 {
    margin: 0 0 1rem;
    font-size: clamp(3.4rem, 16vw, 5.5rem);
    font-weight: 700;
    line-height: 1.05;
    background: var(--grad);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    animation: shimmer 5s linear infinite, bob 3.2s ease-in-out infinite;
    display: inline-block;
  }
  @keyframes shimmer { to { background-position: 300% 0; } }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-8px) rotate(2deg); } }
  .hero p { margin: 0 auto; max-width: 26rem; color: var(--soft); }
  .hero .please { display: block; margin-top: .6rem; font-size: 1.5rem; font-weight: 700; color: var(--pink); }

  /* Questions */
  form { display: grid; gap: 1.4rem; margin-top: 1rem; }
  .q {
    background: var(--card);
    border: 2px dashed var(--rose);
    border-radius: 1.4rem 1.4rem 1.4rem .4rem;
    padding: 1.1rem 1.1rem 1.2rem;
    box-shadow: 0 6px 0 var(--blush);
  }
  .q:nth-child(even) { border-radius: 1.4rem 1.4rem .4rem 1.4rem; }
  .q label { display: block; font-weight: 700; margin-bottom: .7rem; }
  .q label small { display: block; font-weight: 300; color: var(--soft); }
  textarea {
    width: 100%;
    min-height: 4.5rem;
    resize: vertical;
    font: inherit;
    color: var(--ink);
    background: #fff9fc;
    border: 2px solid var(--blush);
    border-radius: .9rem;
    padding: .7rem .85rem;
    transition: border-color .2s, box-shadow .2s;
  }
  textarea::placeholder { color: #c9a3b5; }
  textarea:focus { outline: none; border-color: var(--pink); box-shadow: 0 0 0 4px rgba(255,92,157,.2); }

  /* Button */
  button {
    font: inherit; font-weight: 700; font-size: 1.25rem;
    color: #fff;
    background: var(--grad); background-size: 200% 100%;
    border: 0; border-radius: 999px;
    padding: .9rem 1.5rem;
    width: 100%;
    cursor: pointer;
    box-shadow: 0 6px 0 #d63d7d;
    transition: transform .15s, box-shadow .15s, background-position .4s;
  }
  button:hover { background-position: 100% 0; }
  button:active { transform: translateY(4px); box-shadow: 0 2px 0 #d63d7d; }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .thanks {
    display: none; text-align: center; font-weight: 700; color: var(--pink);
    background: var(--card); border: 2px dashed var(--rose); border-radius: 1.4rem; padding: 1.2rem;
  }
  .thanks.show { display: block; animation: pop .5s cubic-bezier(.3,1.6,.5,1); }
  @keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  footer {
    text-align: center; padding: 1.5rem 1rem calc(2rem + env(safe-area-inset-bottom, 0px));
    color: var(--soft); font-size: 1.1rem;
  }

  @media (prefers-reduced-motion: reduce) {
    .hero h1, .thanks.show { animation: none; }
    html { scroll-behavior: auto; }
  }
</style>
</head>
<body>
<main>
  <header class="hero">
    <h1>Hey Aliya</h1>
    <p>This is a feedback form created only for you 🫵. Could you please answer the following questions…..
      <span class="please">Pretty Please 🥺</span>
    </p>
  </header>

  <form id="checkin" autocomplete="off">
    <div class="q">
      <label for="q1">Q1. Apart from the obvious “two” things, which three things Saquib did that annoyed Aliya?
        <small>(You can list more if you want, because I know there are a plethora of these things)</small></label>
      <textarea id="q1" name="q1" placeholder="Spill it…" rows="3"></textarea>
    </div>

    <div class="q">
      <label for="q2">Q2. What should Saquib do less of in order to be a better partner for Aliya?</label>
      <textarea id="q2" name="q2" placeholder="Be honest, he can take it…" rows="3"></textarea>
    </div>

    <div class="q">
      <label for="q3">Q3. What can Saquib improve to be more likeable by Aliya?</label>
      <textarea id="q3" name="q3" placeholder="Tell me how to level up…" rows="3"></textarea>
    </div>

    <div class="q">
      <label for="q4">Q4. What was the one thing Saquib did last week which made Aliya feel special?
        <small>(Only mention one)</small></label>
      <textarea id="q4" name="q4" placeholder="Just one, no cheating…" rows="3"></textarea>
    </div>

    <div class="q">
      <label for="q5">Q5. Any message you want to convey to Saquib?</label>
      <textarea id="q5" name="q5" placeholder="You can say anything" rows="3"></textarea>
    </div>

    <div class="q">
      <label for="q6">Q6. Most importantly, Is Aliya enjoying the ride till now?</label>
      <textarea id="q6" name="q6" placeholder="No need to be gentle with the answer" rows="3"></textarea>
    </div>

    <button type="submit">Send it with love 💌</button>
    <div class="thanks" id="thanks" role="status"></div>
  </form>
</main>

<footer>Created by 🐼 for 🐯</footer>

<script>
  // Paste your Google Apps Script web app URL between the quotes (it ends in /exec)
  const ENDPOINT = "https://script.google.com/macros/s/AKfycbzEla09BMcUHgSN1iJXRvEOORb-jvNSNS_ZDdel0owdIpV4WYZHTHu_M4z-kresduZ6/exec";

  const form = document.getElementById('checkin');
  const thanks = document.getElementById('thanks');
  const btn = form.querySelector('button');

  function show(msg) {
    thanks.textContent = msg;
    thanks.classList.remove('show');
    void thanks.offsetWidth;
    thanks.classList.add('show');
    thanks.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  // If anything unexpected breaks, say so on screen instead of failing silently
  window.addEventListener('error', (ev) => show('Page error: ' + ev.message));

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(form).entries());
    btn.disabled = true;
    btn.textContent = 'Sending… 💌';
    if (!ENDPOINT) {
      show('Thank you, Aliya 💗 (Sending is not hooked up yet, so nothing has been delivered.)');
    } else {
      try {
        // no-cors + URL-encoded body works with a Google Apps Script web app
        await fetch(ENDPOINT, { method: 'POST', mode: 'no-cors', body: new URLSearchParams(data) });
        show('Sent! Thank you, Ma\'am' 💗');
      } catch (err) {
        show('Oops, that did not go through. Please try once more 🙈');
      }
    }
    btn.disabled = false;
    btn.textContent = 'Send it with love 💌';
  });
</script>
</body>
</html>
